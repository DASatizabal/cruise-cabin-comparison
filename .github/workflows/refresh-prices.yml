name: Refresh prices

# Daily: ask NCL's vacation-builder API for both sailings at 2, 3, 4 and 5 guests
# (8 availability calls and 8 price summary calls, 2 seconds apart, nothing held).
# Scheduled runs only happen on the default branch (main). The push trigger below lets
# this branch test the workflow on GitHub's runners before it is merged.
on:
  schedule:
    - cron: "17 10 * * *"   # 10:17 UTC, about 6:17 AM Miami time in summer
  workflow_dispatch:
  push:
    branches: [claude/cabin-selector-improvements-08QHA]
    paths:
      - tools/fetch_prices.py
      - tools/check_prices.py
      - .github/workflows/refresh-prices.yml

permissions:
  contents: write

concurrency:
  group: refresh-prices
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Fetch prices from NCL into a new file
        run: python3 tools/fetch_prices.py --out data/prices.new.json

      - name: Format check (keeps the old file if this fails)
        run: python3 tools/check_prices.py data/prices.new.json

      - name: Replace the data file and commit
        run: |
          mv data/prices.new.json data/prices.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prices.json
          if git diff --cached --quiet; then
            echo "No change to commit."
            exit 0
          fi
          git commit -m "Refresh prices $(date -u +%Y-%m-%d)"
          for i in 1 2 3 4; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((2 ** i))
          done
          exit 1
