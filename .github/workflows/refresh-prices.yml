name: Refresh prices

# Daily: ask NCL's vacation-builder API for both sailings at 2, 3, 4 and 5 guests, plus one
# age test per ship (20 calls, 2 seconds apart, nothing held), commit the new data file,
# then publish the site in the same run.
# Scheduled runs only happen on the default branch (main). The push trigger below lets
# this branch test the fetch on GitHub's runners before it is merged; only main is published.
on:
  schedule:
    - cron: "17 10 * * *"   # 10:17 UTC, about 6:17 AM Miami time in summer
  workflow_dispatch:
  push:
    branches: [claude/cabin-selector-improvements-08QHA]
    paths:
      - tools/fetch_prices.py
      - tools/check_prices.py
      - .github/workflows/refresh-prices.yml

permissions:
  contents: write

concurrency:
  group: refresh-prices
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch prices from NCL into a new file
        run: python3 tools/fetch_prices.py --out data/prices.new.json

      - name: Format check (keeps the old file if this fails)
        run: python3 tools/check_prices.py data/prices.new.json

      - name: Replace the data file and commit
        id: commit
        run: |
          mv data/prices.new.json data/prices.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prices.json
          if git diff --cached --quiet; then
            echo "No change to commit."
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Refresh prices $(date -u +%Y-%m-%d)"
          for i in 1 2 3 4; do
            if git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep $((2 ** i))
          done
          exit 1

  # Commits made with GITHUB_TOKEN don't start a Pages build, so publish here, from the new commit.
  publish:
    needs: refresh
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-pages.yml
    with:
      ref: ${{ needs.refresh.outputs.sha }}

  # GitHub turns off scheduled workflows in public repos after 60 days without "repository
  # activity" and doesn't define activity. The daily data commit is probably enough; as a
  # safety net, mark this workflow enabled again on every scheduled run. Never fails the run.
  keepalive:
    if: github.ref == 'refs/heads/main' && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Keep the daily schedule enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable refresh-prices.yml --repo "$GITHUB_REPOSITORY" || echo "Could not re-enable (not fatal)."
