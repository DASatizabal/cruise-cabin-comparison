name: Deploy site

# Publishes the family page to GitHub Pages (Settings, Pages, Source: GitHub Actions).
# Runs on every push to main, on demand, and from the daily refresh right after its commit
# (commits made with GITHUB_TOKEN don't start a Pages build by themselves).
# Only main is ever published; runs for any other branch skip both jobs.
#
# Upload and deploy are separate jobs, and the deploy is retried once. deploy-pages lists the
# run's artifacts by name, and that listing can come back empty for an artifact finalized a
# fraction of a second earlier in the same job (actions/deploy-pages issue 451). The artifact
# name includes the run attempt so "Re-run all jobs" can't leave two artifacts with the same
# name in one run (issue 338); "Re-run failed jobs" reuses the name the build job reported.
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: "Commit to publish (the refresh workflow passes its new data commit)"
        type: string
        required: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      artifact: ${{ steps.name.outputs.artifact }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Release check (never publish a bad page or data file)
        run: python3 tools/check_release.py

      - name: Collect the site files
        run: |
          mkdir -p _site/data
          cp index.html _site/index.html
          cp data/prices.json _site/data/prices.json

      - name: Name the artifact for this run attempt
        id: name
        run: echo "artifact=github-pages-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          name: ${{ steps.name.outputs.artifact }}

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.second.outputs.page_url || steps.first.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: first
        continue-on-error: true
        uses: actions/deploy-pages@v5
        with:
          artifact_name: ${{ needs.build.outputs.artifact }}

      - name: Wait before retrying
        if: steps.first.outcome == 'failure'
        run: sleep 30

      - name: Publish to GitHub Pages (retry)
        id: second
        if: steps.first.outcome == 'failure'
        uses: actions/deploy-pages@v5
        with:
          artifact_name: ${{ needs.build.outputs.artifact }}
