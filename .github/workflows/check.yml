name: Release check

# Blocks a release when the data file is malformed, the version is inconsistent, or an
# offline tool test fails (tools/test_tools.py: no NCL calls).
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: python3 tools/check_release.py
      - run: python3 tools/test_tools.py
