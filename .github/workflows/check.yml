name: Release check

# Blocks a release when a data file is malformed, the version is inconsistent, an offline tool
# test fails (tools/test_tools.py: no NCL calls), or a workflow file has a mistake (actionlint,
# pinned image, which also runs shellcheck on every run: block).
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: python3 tools/check_release.py
      - run: python3 tools/test_tools.py
      - name: Lint the workflow files (actionlint)
        uses: docker://rhysd/actionlint:1.7.7
        with:
          args: -color
